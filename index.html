<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enam Trims Ltd — Maintenance ERP</title>
<style>
  :root{
    --forest:#2E4A3A;
    --sage:#4B6155;
    --sage-light:#647a6d;
    --cream:#F8F2EA;
    --paper:#FFFFFF;
    --mist:#E8EEDC;
    --rust:#9C5B48;
    --rust-dark:#7c4737;
    --ink:#233428;
    --ink-soft:#5b6a60;
    --line:#DFE3D8;
    --danger:#B3462C;
    --warn:#B98A2E;
    --ok:#3F7A54;
    --shadow: 0 2px 10px rgba(35,52,40,0.08);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    background:var(--cream);
    color:var(--ink);
    font-size:14px;
  }
  h1,h2,h3,h4{font-family:'Georgia', 'Iowan Old Style', serif; margin:0; color:var(--forest); letter-spacing:.2px;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:13.5px;}

  /* ---------- App shell ---------- */
  #app{min-height:100vh; display:flex; flex-direction:column;}

  .topbar{
    background:var(--forest);
    color:#fff;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px;
    box-shadow:var(--shadow);
    position:sticky; top:0; z-index:40;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand img{height:34px; display:block; border-radius:4px;}
  .brand-text{line-height:1.15;}
  .brand-text .co{font-weight:700; font-size:15px; letter-spacing:.3px;}
  .brand-text .sub{font-size:11px; color:#cfd9d0; letter-spacing:.5px; text-transform:uppercase;}
  .who{display:flex; align-items:center; gap:10px; font-size:13px;}
  .who .name{font-weight:600;}
  .role-pill{
    background:var(--mist); color:var(--forest); border-radius:999px; padding:2px 10px;
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
  }
  .signout{
    background:transparent; border:1px solid rgba(255,255,255,.35); color:#fff;
    padding:6px 12px; border-radius:8px; font-size:12.5px;
  }
  .signout:hover{background:rgba(255,255,255,.12);}

  .shell{display:flex; flex:1; min-height:0;}
  .sidebar{
    width:220px; flex:0 0 220px; background:var(--sage); color:#f2f5f0;
    padding:16px 10px; display:flex; flex-direction:column; gap:3px;
  }
  .side-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:#cddbd0; padding:12px 10px 4px;}
  .side-btn{
    display:flex; align-items:center; gap:10px;
    background:transparent; border:none; color:#eef2ec; text-align:left;
    padding:9px 10px; border-radius:8px; font-size:13.5px;
  }
  .side-btn:hover{background:rgba(255,255,255,.08);}
  .side-btn.active{background:var(--cream); color:var(--forest); font-weight:700;}
  .side-icon{width:18px; text-align:center; font-size:15px;}

  .main{flex:1; min-width:0; padding:22px 26px 60px; overflow-y:auto;}
  .page-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; flex-wrap:wrap; gap:10px;}
  .page-head h2{font-size:22px;}
  .page-sub{color:var(--ink-soft); font-size:12.5px; margin-top:2px;}
  .divider{height:1px; background:var(--line); margin:14px 0 18px;}

  /* ---------- Buttons ---------- */
  .btn{
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{border-color:var(--sage-light);}
  .btn-primary{background:var(--rust); border-color:var(--rust); color:#fff;}
  .btn-primary:hover{background:var(--rust-dark); border-color:var(--rust-dark);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--sage);}
  .btn-ghost:hover{background:var(--mist);}
  .btn-sm{padding:5px 10px; font-size:12px; border-radius:6px;}
  .btn-danger{color:var(--danger); border-color:#e6c9bf;}
  .btn-danger:hover{background:#fbeee9;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  /* ---------- Cards / stats ---------- */
  .cards-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:20px;}
  .stat-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
  .stat-card .label{font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-soft); margin-bottom:6px;}
  .stat-card .value{font-family:Georgia,serif; font-size:26px; color:var(--forest); font-weight:700;}
  .stat-card .note{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
  .stat-card.accent{border-color:var(--rust); }
  .stat-card.accent .value{color:var(--rust);}

  .panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); margin-bottom:20px;}
  .panel h3{font-size:15px; margin-bottom:10px;}
  .panel h3 .cnt{color:var(--ink-soft); font-weight:400; font-size:12.5px;}

  .bar-row{display:grid; grid-template-columns:140px 1fr 46px; align-items:center; gap:10px; margin:7px 0;}
  .bar-row .lbl{font-size:12.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{background:var(--mist); border-radius:6px; height:12px; overflow:hidden;}
  .bar-fill{background:linear-gradient(90deg,var(--sage),var(--rust)); height:100%; border-radius:6px;}
  .bar-row .num{font-size:12px; text-align:right; color:var(--ink-soft);}

  /* ---------- Filters ---------- */
  .filter-bar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:14px;
  }
  .filter-field{display:flex; flex-direction:column; gap:4px;}
  .filter-field label{font-size:10.5px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.3px;}
  .filter-field input, .filter-field select{
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; min-width:120px; background:#fff;
  }
  .filter-field.grow{flex:1; min-width:180px;}
  .filter-field.grow input{width:100%;}

  /* ---------- Table ---------- */
  .table-wrap{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    background:var(--mist); color:var(--forest); text-align:left; font-size:11px;
    text-transform:uppercase; letter-spacing:.3px; padding:10px 12px; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fbfaf6;}
  .empty-row td{text-align:center; color:var(--ink-soft); padding:26px; font-style:italic;}
  .row-actions{display:flex; gap:6px; white-space:nowrap;}
  .muted{color:var(--ink-soft); font-size:11.5px;}
  .cell-wrap{max-width:220px; white-space:normal;}

  /* ---------- Badges ---------- */
  .badge{display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.2px;}
  .b-green{background:#e4f0e6; color:var(--ok);}
  .b-amber{background:#f6ecd8; color:var(--warn);}
  .b-red{background:#f6e0d8; color:var(--danger);}
  .b-gray{background:#eceee9; color:var(--ink-soft);}
  .b-forest{background:var(--mist); color:var(--forest);}

  /* ---------- Modal / form ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(35,52,40,.45); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 16px; overflow-y:auto; z-index:100;
  }
  .modal{
    background:var(--paper); border-radius:12px; width:100%; max-width:560px; padding:22px 24px 20px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);
  }
  .modal h3{font-size:17px; margin-bottom:2px;}
  .modal .modal-sub{color:var(--ink-soft); font-size:12px; margin-bottom:14px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field{display:flex; flex-direction:column; gap:4px; margin-bottom:2px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:11.5px; font-weight:700; color:var(--forest); text-transform:uppercase; letter-spacing:.2px;}
  .field label .req{color:var(--rust);}
  .field input, .field select, .field textarea{
    border:1px solid var(--line); border-radius:7px; padding:8px 10px; background:#fff; color:var(--ink); width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--sage-light); outline-offset:0;}
  .field textarea{resize:vertical; min-height:56px;}
  .form-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px; border-top:1px solid var(--line); padding-top:14px;}
  .field-hint{font-size:11px; color:var(--ink-soft);}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:
      radial-gradient(circle at 15% 10%, #3a5847 0%, transparent 45%), var(--forest); padding:20px;}
  .login-card{background:var(--cream); border-radius:16px; padding:36px 36px 30px; width:100%; max-width:440px; box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-logo{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
  .login-logo img{height:46px; border-radius:6px;}
  .login-logo .co{font-weight:700; font-size:17px; color:var(--forest);}
  .login-logo .sub{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px;}
  .login-card h2{font-size:20px; margin-bottom:4px;}
  .login-card .lead{color:var(--ink-soft); font-size:12.5px; margin-bottom:18px;}
  .roster-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; max-height:320px; overflow-y:auto; margin-bottom:6px;}
  .roster-item{
    border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 12px; text-align:left;
  }
  .roster-item:hover{border-color:var(--rust);}
  .roster-item .rn{font-weight:700; font-size:13.5px; color:var(--ink);}
  .roster-item .rr{font-size:11px; color:var(--sage); text-transform:uppercase; letter-spacing:.3px; margin-top:2px;}
  .pin-box{display:flex; gap:8px; margin-top:14px;}
  .pin-box input{flex:1; text-align:center; letter-spacing:6px; font-size:18px; padding:10px;}
  .login-error{color:var(--danger); font-size:12.5px; margin-top:8px;}
  .back-link{font-size:12.5px; color:var(--sage); margin-top:10px; display:inline-block; background:none; border:none; padding:0; text-decoration:underline;}

  /* ---------- Perm matrix ---------- */
  .perm-table th, .perm-table td{text-align:center;}
  .perm-table td:first-child, .perm-table th:first-child{text-align:left;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--forest); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px;
    box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  @media (max-width:820px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; overflow-x:auto; padding:8px; gap:6px;}
    .side-label{display:none;}
    .side-btn{white-space:nowrap;}
    .main{padding:16px;}
    .form-grid{grid-template-columns:1fr;}
    .roster-grid{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
// ===================== ENAM TRIMS LTD — MAINTENANCE ERP =====================
// Single-file client app. Data persists in Supabase (table: erp_store).
// Session/login state persists in the browser via localStorage (per device).

// ---------- Supabase connection ----------
// Paste your Project URL and anon public key from Supabase → Settings → API.
const SUPABASE_URL = 'https://ajvdglrdujhjjitdaafl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_UFSaPAzxNpR6SPt443wGog_-7BeD5UH';
const SUPABASE_CONFIGURED = !SUPABASE_URL.startsWith('YOUR_') && !SUPABASE_ANON_KEY.startsWith('YOUR_');
const sb = SUPABASE_CONFIGURED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

// ---------- Storage helpers ----------
const DKEYS = {
  users:'data_users', machines:'data_machines', sections:'data_sections', roster:'data_roster', pm:'data_pm', breakdown:'data_breakdown',
  stock:'data_stock', spareuse:'data_spareuse', sparereq:'data_sparereq',
  repair:'data_repair', risk:'data_risk'
};

async function loadArr(key){
  try{
    const { data, error } = await sb.from('erp_store').select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    if(!data || !data.value) return [];
    return Array.isArray(data.value) ? data.value : [];
  }catch(e){ console.error('load failed', key, e); return []; }
}
async function saveArr(key, arr){
  try{
    const { error } = await sb.from('erp_store').upsert({ key, value: arr, updated_at: new Date().toISOString() });
    if(error) throw error;
  }catch(e){ console.error('save failed', key, e); toast('Save failed — check your connection and try again.'); }
}
// Session state is per-browser, not organization data, so it lives in localStorage (not Supabase).
async function getPersonal(key){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
async function setPersonal(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; try{ const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;} }
function monthKey(d){ return (d||'').slice(0,7); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let toastTimer=null;
function toast(msg){
  let t = document.getElementById('toastEl');
  if(!t){ t=document.createElement('div'); t.id='toastEl'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

// ---------- Roles & permissions ----------
// Levels: 'none' < 'view' < 'create' < 'edit' < 'full'
const LEVEL_RANK = {none:0, view:1, create:2, edit:3, full:4};
function atLeast(level, min){ return (LEVEL_RANK[level]||0) >= LEVEL_RANK[min]; }

const PERM_MODULE_KEYS = ['machines','sections','stock','roster','pm','breakdown','spareuse','sparereq','repair','risk','users'];
const LEVEL_LABELS = {none:'No access', view:'View only', create:'Can add entries', edit:'Can edit all', full:'Full control (incl. delete)'};

// Modules marked as MASTER DATA are locked to Admin-only editing by default
// (everyone else can view). Admin can still grant a specific person edit
// rights via the "Access" button on that user in Users & Access.
const MASTER_DATA_MODULES = ['machines','sections','stock','roster'];

const PERMS = {
  Admin:      { users:'full', machines:'full', sections:'full', stock:'full', roster:'full', pm:'full', breakdown:'full', spareuse:'full', sparereq:'full', repair:'full', risk:'full' },
  Manager:    { users:'view', machines:'view', sections:'view', stock:'view', roster:'view', pm:'full', breakdown:'full', spareuse:'full', sparereq:'full', repair:'full', risk:'full' },
  Technician: { users:'none', machines:'view', sections:'view', stock:'view', roster:'view', pm:'edit', breakdown:'edit', spareuse:'edit', sparereq:'edit', repair:'create', risk:'create' },
  Operator:   { users:'none', machines:'view', sections:'view', stock:'none', roster:'view', pm:'view', breakdown:'create', spareuse:'none', sparereq:'none', repair:'none', risk:'none' }
};
const ROLE_DESC = {
  Admin:'Full control: manages master data (machines, sections, spare parts catalog), manages users, and all daily records.',
  Manager:'Full access to daily records (PM, breakdowns, spare usage, costs, risk); can view but not edit master data or user accounts.',
  Technician:'Can log breakdowns, complete PM tasks, record spare part usage & requests, add repair/risk entries. Views master data only.',
  Operator:'Can view schedules and report machine breakdowns; read-only elsewhere.'
};
// Per-user overrides let the Admin fine-tune access beyond the role default,
// e.g. give one specific Technician edit rights on Repair Costs.
function permLevel(moduleKey, forUser){
  const target = forUser || STATE.user;
  if(!target) return 'none';
  const full = STATE.data.users.find(x=>x.id===target.id) || target;
  const ov = full.permOverride && full.permOverride[moduleKey];
  if(ov && ov!=='default') return ov;
  const role = full.role;
  return (PERMS[role] && PERMS[role][moduleKey]) || 'none';
}
function canView(moduleKey){ return permLevel(moduleKey) !== 'none'; }
function canCreate(moduleKey){ return atLeast(permLevel(moduleKey),'create'); }
function canEditAny(moduleKey){ return atLeast(permLevel(moduleKey),'edit'); }
function canDeleteAny(moduleKey){ return permLevel(moduleKey)==='full'; }
function canEditRecord(moduleKey, rec){
  const lvl = permLevel(moduleKey);
  if(atLeast(lvl,'edit')) return true;
  if(lvl==='create' && rec.createdBy===STATE.user.id) return true;
  return false;
}
function canDeleteRecord(moduleKey, rec){
  const lvl = permLevel(moduleKey);
  if(lvl==='full') return true;
  if(lvl==='create' && rec.createdBy===STATE.user.id) return true;
  return false;
}

// ---------- Global state ----------
const STATE = {
  user:null,           // {id,name,role,section}
  tab:'dashboard',
  data:{ users:[], machines:[], sections:[], roster:[], pm:[], breakdown:[], stock:[], spareuse:[], sparereq:[], repair:[], risk:[] },
  filters:{},           // per-module filter state, keyed by moduleKey
  searchFilters:{module:'all', from:'', to:'', machine:'', section:'', q:''},
  modalStack:null
};

async function loadAllData(){
  const keys = Object.keys(DKEYS);
  const results = await Promise.all(keys.map(k=>loadArr(DKEYS[k])));
  keys.forEach((k,i)=> STATE.data[k]=results[i]);
}

function machineName(id){
  const m = STATE.data.machines.find(x=>x.id===id);
  return m ? m.name + (m.code?(' ('+m.code+')'):'') : '—';
}
function machineSection(id){
  const m = STATE.data.machines.find(x=>x.id===id);
  return m ? m.section : '';
}
function userName(id){
  const u = STATE.data.users.find(x=>x.id===id);
  return u ? u.name : '—';
}
function activeUsers(){ return STATE.data.users.filter(u=>u.active!=='No'); }
function techAndUp(){ return STATE.data.users.filter(u=>['Admin','Manager','Technician'].includes(u.role) && u.active!=='No'); }
// ===================== MODULE SCHEMAS =====================
// Each module drives the generic list/filter/form engine below.

function opt(v,l){ return {value:v, label:l}; }
function staticOpts(arr){ return arr.map(v=>opt(v,v)); }

function machineOptions(){
  return STATE.data.machines
    .slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(m=>opt(m.id, m.name + (m.code?(' — '+m.code):'') + (m.section?(' · '+m.section):'')));
}
function sectionOptions(){
  return STATE.data.sections
    .slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(s=>opt(s.name, s.name));
}
function userOptions(roles){
  return STATE.data.users
    .filter(u=> (!roles || roles.includes(u.role)) && u.active!=='No')
    .slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(u=>opt(u.id, u.name + ' ('+u.role+')'));
}
function stockPartOptions(){
  return STATE.data.stock.slice().sort((a,b)=>a.partName.localeCompare(b.partName))
    .map(s=>opt(s.partName, s.partName + (s.code?(' — '+s.code):'')));
}

const BADGE_MAP = {
  'Running':'b-green','Completed':'b-green','Resolved':'b-green','Received':'b-green','Approved':'b-green','Closed':'b-green','Mitigated':'b-green','Low':'b-green',

  'Overdue':'b-red','Breakdown':'b-red','Open':'b-red','High':'b-red','Critical':'b-red','Cancelled':'b-gray','Skipped':'b-gray',
  'Under Maintenance':'b-amber'
};
function badgeHtml(val){
  const cls = BADGE_MAP[val] || 'b-gray';
  return '<span class="badge '+cls+'">'+esc(val)+'</span>';
}

// ===================== GENERIC LIST + FILTER ENGINE =====================

function getRecords(moduleKey){ return STATE.data[MODULES[moduleKey].storageKey]; }

function fieldOptions(field){
  if(!field.options) return [];
  return typeof field.options==='function' ? field.options() : field.options;
}
function optionLabel(field, value){
  const opts = fieldOptions(field);
  const f = opts.find(o=>o.value===value);
  return f ? f.label : value;
}

function applyFilters(moduleKey, records){
  const f = STATE.filters[moduleKey] || {};
  const mod = MODULES[moduleKey];
  return records.filter(r=>{
    if(f.machine && mod.machineField && r[mod.machineField]!==f.machine) return false;
    if(f.section && mod.machineField && machineSection(r[mod.machineField])!==f.section) return false;
    if(f.by && r.createdBy!==f.by) return false;
    if(f.status && r.status!==f.status) return false;
    if(mod.dateField){
      const d = r[mod.dateField];
      if(f.from && (!d || d < f.from)) return false;
      if(f.to && (!d || d > f.to)) return false;
    }
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = mod.fields.filter(fl=>fl.type==='text'||fl.type==='textarea')
        .map(fl=>String(r[fl.name]||'')).join(' ').toLowerCase()
        + ' ' + (r.createdByName||'').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
}

function renderFilterBar(moduleKey){
  const mod = MODULES[moduleKey];
  const f = STATE.filters[moduleKey] || (STATE.filters[moduleKey]={});
  let html = '<div class="filter-bar">';

  if(mod.dateField){
    html += `<div class="filter-field"><label>From</label><input type="date" value="${esc(f.from||'')}" onchange="setFilter('${moduleKey}','from',this.value)"></div>`;
    html += `<div class="filter-field"><label>To</label><input type="date" value="${esc(f.to||'')}" onchange="setFilter('${moduleKey}','to',this.value)"></div>`;
  }
  if(mod.machineField){
    html += `<div class="filter-field"><label>Section</label><select onchange="setFilter('${moduleKey}','section',this.value)">
      <option value="">All sections</option>
      ${sectionOptions().map(o=>`<option value="${esc(o.value)}" ${f.section===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select></div>`;
    html += `<div class="filter-field"><label>Machine</label><select onchange="setFilter('${moduleKey}','machine',this.value)">
      <option value="">All machines</option>
      ${machineOptions().map(o=>`<option value="${esc(o.value)}" ${f.machine===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select></div>`;
  }
  const statusField = mod.fields.find(x=>x.name==='status');
  if(statusField){
    html += `<div class="filter-field"><label>Status</label><select onchange="setFilter('${moduleKey}','status',this.value)">
      <option value="">All statuses</option>
      ${fieldOptions(statusField).map(o=>`<option value="${esc(o.value)}" ${f.status===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select></div>`;
  }
  html += `<div class="filter-field"><label>Entered By</label><select onchange="setFilter('${moduleKey}','by',this.value)">
    <option value="">All users</option>
    ${STATE.data.users.map(u=>`<option value="${esc(u.id)}" ${f.by===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}
  </select></div>`;
  html += `<div class="filter-field grow"><label>Search</label><input type="text" placeholder="Search text…" value="${esc(f.q||'')}" oninput="setFilter('${moduleKey}','q',this.value)"></div>`;
  html += `<button class="btn btn-ghost btn-sm" onclick="clearFilters('${moduleKey}')">Clear</button>`;
  html += '</div>';
  return html;
}
function setFilter(moduleKey, key, val){
  STATE.filters[moduleKey] = STATE.filters[moduleKey] || {};
  STATE.filters[moduleKey][key] = val;
  renderMain();
}
function clearFilters(moduleKey){ STATE.filters[moduleKey] = {}; renderMain(); }

function renderModuleTab(moduleKey){
  const mod = MODULES[moduleKey];
  const lvl = permLevel(moduleKey);
  const all = getRecords(moduleKey);
  const rows = applyFilters(moduleKey, all);
  const listFields = mod.fields.filter(f=>f.list);

  let html = `<div class="page-head"><div><h2>${mod.icon} ${mod.label}</h2>
    <div class="page-sub">${all.length} total record${all.length===1?'':'s'} · showing ${rows.length}</div></div>`;
  if(canCreate(moduleKey)){
    html += `<button class="btn btn-primary" onclick="openForm('${moduleKey}', null)">+ Add ${esc(mod.singular)}</button>`;
  }
  html += `</div><div class="divider"></div>`;

  if(mod.masterData){
    html += `<div class="panel" style="padding:10px 16px; margin-bottom:14px; display:flex; align-items:center; gap:10px;">
      <span class="badge b-forest">Master Data</span>
      <span class="muted">${permLevel(moduleKey)==='full' ? 'You can add, edit, and delete these records. Everyone else can only view them.' : 'Only your Admin can add, edit, or delete these records — ask them if something needs to change.'}</span>
    </div>`;
  }

  if(moduleKey==='machines' && canCreate('machines') && all.length===0){
    html += `<div class="panel" style="border-color:var(--rust);"><h3>Load your starter machine list?</h3>
      <div class="muted" style="margin-bottom:10px;">We found ${SEED_MACHINES.length} machines & utilities in your uploaded maintenance files (Offset, PFL, Die Cutting, Finishing, Woven, Thermal, ETP, and more). Add them now and edit freely afterwards.</div>
      <button class="btn btn-primary btn-sm" onclick="importSeedMachines()">Load Starter Machine List</button></div>`;
  }
  if(moduleKey==='roster' && canCreate('roster') && all.length===0){
    html += `<div class="panel" style="border-color:var(--rust);"><h3>Load your known team members?</h3>
      <div class="muted" style="margin-bottom:10px;">We found ${SEED_ROSTER.length} maintenance team members in your uploaded files. Add them now — you can edit, remove, or add more people at any time.</div>
      <button class="btn btn-primary btn-sm" onclick="importSeedRoster()">Load Starter Team List</button></div>`;
  }

  html += renderFilterBar(moduleKey);

  html += '<div class="table-wrap"><table><thead><tr>';
  listFields.forEach(f=> html += `<th>${esc(f.label)}</th>`);
  html += `<th>Entered By</th><th>Date Added</th><th></th></tr></thead><tbody>`;

  if(rows.length===0){
    html += `<tr class="empty-row"><td colspan="${listFields.length+3}">No records match your filters yet.${canCreate(moduleKey)?' Click “Add” to create the first entry.':''}</td></tr>`;
  } else {
    rows.forEach(r=>{
      html += '<tr>';
      listFields.forEach(f=>{
        let val = r[f.name];
        if(f.name==='machineId') val = machineName(val);
        else if(f.options) val = optionLabel(f, val);
        if(f.badge) html += `<td>${val?badgeHtml(val):'—'}</td>`;
        else if(f.type==='date') html += `<td>${fmtDate(val)}</td>`;
        else if(f.type==='textarea') html += `<td class="cell-wrap">${esc(val||'—')}</td>`;
        else html += `<td>${esc(val!==undefined && val!=='' ? val : '—')}</td>`;
      });
      html += `<td class="muted">${esc(r.createdByName||'—')}</td>`;
      html += `<td class="muted">${fmtDate((r.createdAt||'').slice(0,10))}</td>`;
      html += '<td><div class="row-actions">';
      if(canEditRecord(moduleKey, r)) html += `<button class="btn btn-sm btn-ghost" onclick="openForm('${moduleKey}','${r.id}')">Edit</button>`;
      if(moduleKey==='users' && permLevel('users')==='full') html += `<button class="btn btn-sm btn-ghost" onclick="openAccessEditor('${r.id}')">Access</button>`;
      if(canDeleteRecord(moduleKey, r)) html += `<button class="btn btn-sm btn-danger" onclick="deleteRecord('${moduleKey}','${r.id}')">Delete</button>`;
      html += '</div></td></tr>';
    });
  }
  html += '</tbody></table></div>';
  return html;
}

// ---------- Form modal ----------
function openForm(moduleKey, recordId){
  const mod = MODULES[moduleKey];
  const rec = recordId ? getRecords(moduleKey).find(r=>r.id===recordId) : null;
  STATE.modalStack = {moduleKey, recordId};

  let html = `<div class="modal-backdrop" onmousedown="if(event.target===this) closeForm()">
    <div class="modal">
      <h3>${rec?'Edit':'Add'} ${esc(mod.singular)}</h3>
      <div class="modal-sub">${rec? 'Update the details below.' : 'Fill in the form to add a new record.'}</div>
      <form id="entityForm" onsubmit="submitForm(event)">
      <div class="form-grid">`;

  mod.fields.forEach(f=>{
    const val = rec ? rec[f.name] : (typeof f.default==='function' ? f.default() : (f.default!==undefined ? f.default : ''));
    const full = f.type==='textarea';
    html += `<div class="field ${full?'full':''}"><label>${esc(f.label)} ${f.required && !(f.name==='password'&&rec)?'<span class="req">*</span>':''}</label>`;
    if(f.name==='password'){
      html += `<input type="password" name="password" autocomplete="new-password" placeholder="${rec?'Leave blank to keep current password':'Set a password'}" ${rec?'':'required'}>`;
    } else if(f.type==='select'){
      const opts = fieldOptions(f);
      html += `<select name="${f.name}" ${f.required?'required':''}>`;
      html += `<option value="">— select —</option>`;
      opts.forEach(o=> html += `<option value="${esc(o.value)}" ${String(val)===String(o.value)?'selected':''}>${esc(o.label)}</option>`);
      html += `</select>`;
    } else if(f.type==='textarea'){
      html += `<textarea name="${f.name}" ${f.required?'required':''}>${esc(val)}</textarea>`;
    } else {
      html += `<input type="${f.type}" name="${f.name}" value="${esc(val)}" ${f.step?('step="'+f.step+'"'):''} ${f.required?'required':''}>`;
    }
    if(f.hint) html += `<div class="field-hint">${esc(f.hint)}</div>`;
    html += `</div>`;
  });

  html += `</div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="closeForm()">Cancel</button>
        <button type="submit" class="btn btn-primary">${rec?'Save Changes':'Add Record'}</button>
      </div>
      </form>
    </div>
  </div>`;

  let holder = document.getElementById('modalHolder');
  if(!holder){ holder=document.createElement('div'); holder.id='modalHolder'; document.body.appendChild(holder); }
  holder.innerHTML = html;
}
function closeForm(){
  const holder = document.getElementById('modalHolder');
  if(holder) holder.innerHTML='';
  STATE.modalStack=null;
}
async function submitForm(e){
  e.preventDefault();
  const {moduleKey, recordId} = STATE.modalStack;
  const mod = MODULES[moduleKey];
  const fd = new FormData(e.target);
  const rec = recordId ? getRecords(moduleKey).find(r=>r.id===recordId) : null;

  if(moduleKey==='users'){
    const uname = (fd.get('username')||'').trim().toLowerCase();
    if(!uname){ toast('Username is required.'); return; }
    const clash = STATE.data.users.find(u=>u.id!==recordId && (u.username||'').toLowerCase()===uname);
    if(clash){ toast('That username is already taken — please choose another.'); return; }
    if(!rec && !fd.get('password')){ toast('Please set a password for this new account.'); return; }
  }

  let obj = rec ? Object.assign({}, rec) : {id:uid(moduleKey), createdBy:STATE.user.id, createdByName:STATE.user.name, createdAt:new Date().toISOString()};
  mod.fields.forEach(f=>{
    let v = fd.get(f.name);
    if(f.name==='password'){
      if(v){ obj.password = v; } // keep existing password if left blank on edit
      return;
    }
    if(f.name==='username'){ v = (v||'').trim().toLowerCase(); }
    if(f.type==='number') v = v===''? '' : Number(v);
    obj[f.name]=v;
  });
  obj.updatedAt = new Date().toISOString();
  obj.updatedBy = STATE.user.name;

  const arr = getRecords(moduleKey);
  const idx = arr.findIndex(r=>r.id===obj.id);
  if(idx>=0) arr[idx]=obj; else arr.push(obj);
  await saveArr(DKEYS[mod.storageKey], arr);

  if(moduleKey==='users' && obj.id===STATE.user.id){
    STATE.user = {id:obj.id, name:obj.name, role:obj.role, section:obj.section};
  }

  closeForm();
  toast(rec ? 'Record updated.' : 'Record added.');
  renderMain();
}
async function deleteRecord(moduleKey, id){
  if(!confirm('Delete this record? This cannot be undone.')) return;
  const mod = MODULES[moduleKey];
  let arr = getRecords(moduleKey);
  arr = arr.filter(r=>r.id!==id);
  STATE.data[mod.storageKey]=arr;
  await saveArr(DKEYS[mod.storageKey], arr);
  toast('Record deleted.');
  renderMain();
}

// ---------- Per-user access override editor (Admin only) ----------
function openAccessEditor(userId){
  const u = STATE.data.users.find(x=>x.id===userId);
  if(!u) return;
  const ov = u.permOverride || {};
  let html = `<div class="modal-backdrop" onmousedown="if(event.target===this) closeForm()">
    <div class="modal">
      <h3>Access for ${esc(u.name)}</h3>
      <div class="modal-sub">Role default is <b>${esc(u.role)}</b>. Override any module below to grant or restrict access just for this person — leave as "Use role default" for the rest.</div>
      <form id="accessForm" onsubmit="submitAccessForm(event,'${userId}')">
      <div class="form-grid">`;
  PERM_MODULE_KEYS.forEach(mk=>{
    const mod = MODULES[mk];
    const current = ov[mk] || 'default';
    html += `<div class="field"><label>${mod.icon} ${esc(mod.label)}</label>
      <select name="${mk}">
        <option value="default" ${current==='default'?'selected':''}>Use role default (${LEVEL_LABELS[permLevel(mk,{id:userId,role:u.role})]||''})</option>
        <option value="none" ${current==='none'?'selected':''}>${LEVEL_LABELS.none}</option>
        <option value="view" ${current==='view'?'selected':''}>${LEVEL_LABELS.view}</option>
        <option value="create" ${current==='create'?'selected':''}>${LEVEL_LABELS.create}</option>
        <option value="edit" ${current==='edit'?'selected':''}>${LEVEL_LABELS.edit}</option>
        <option value="full" ${current==='full'?'selected':''}>${LEVEL_LABELS.full}</option>
      </select></div>`;
  });
  html += `</div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="closeForm()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Access</button>
      </div>
      </form>
    </div>
  </div>`;
  let holder = document.getElementById('modalHolder');
  if(!holder){ holder=document.createElement('div'); holder.id='modalHolder'; document.body.appendChild(holder); }
  holder.innerHTML = html;
}
async function submitAccessForm(e, userId){
  e.preventDefault();
  const fd = new FormData(e.target);
  const arr = STATE.data.users;
  const u = arr.find(x=>x.id===userId);
  if(!u) return;
  const ov = {};
  PERM_MODULE_KEYS.forEach(mk=>{
    const v = fd.get(mk);
    if(v && v!=='default') ov[mk]=v;
  });
  u.permOverride = ov;
  await saveArr(DKEYS.users, arr);
  closeForm();
  toast('Access updated for '+u.name+'.');
  renderMain();
}

// ---------- Quick prefill from Team Roster reference ----------
// Maps a free-text job title (from the Team Directory) to the closest fixed
// option in the Add User "Designation" dropdown.
function guessDesignation(title){
  const t = (title||'').toLowerCase();
  if(t.includes('fire safety')) return 'Fire Safety Officer';
  if(t.includes('electrician')) return 'Electrician';
  if(t.includes('sr. executive') || t.includes('senior executive')) return 'Sr. Executive';
  if(t.includes('executive')) return 'Executive';
  if(t.includes('management') || t.includes('manager')) return 'Management';
  if(t.includes('operator')) return 'Machine Operator';
  if(t.includes('technician')) return 'Technician';
  if(t.includes('store')) return 'Store Officer';
  return 'Other';
}
function prefillUserFromRoster(rosterId){
  const person = STATE.data.roster.find(p=>p.id===rosterId);
  if(!person) return;
  openForm('users', null);
  setTimeout(()=>{
    const f = document.getElementById('entityForm');
    if(!f) return;
    f.querySelector('[name=name]').value = person.name;
    f.querySelector('[name=designation]').value = guessDesignation(person.title);
    f.querySelector('[name=role]').value = person.suggestedRole || '';
    f.querySelector('[name=section]').value = 'Maintenance';
    f.querySelector('[name=phone]').value = person.phone || '';
    const uname = person.name.toLowerCase().replace(/^md\.?\s*/,'').replace(/[^a-z]+/g,'.').replace(/^\.|\.$/g,'');
    f.querySelector('[name=username]').value = uname;
  }, 30);
}

async function importSeedMachines(){
  if(!confirm('Add '+SEED_MACHINES.length+' starter machines & utilities based on your maintenance files? You can edit or delete any of them afterwards.')) return;
  const existing = new Set(STATE.data.machines.map(m=>m.name.toLowerCase()));
  const toAdd = SEED_MACHINES.filter(m=>!existing.has(m.name.toLowerCase())).map(m=>({

  STATE.data.machines = STATE.data.machines.concat(toAdd);
  await saveArr(DKEYS.machines, STATE.data.machines);
  toast(toAdd.length+' machines added.');
  renderMain();
}

// ===================== DASHBOARD =====================
function firstDayOfMonth(){ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10); }
function lastDayOfMonth(){ const d=new Date(); return new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10); }

function renderDashboard(){
  if(STATE.dashFrom===undefined) STATE.dashFrom = firstDayOfMonth();
  if(STATE.dashTo===undefined) STATE.dashTo = lastDayOfMonth();
  if(STATE.dashSection===undefined) STATE.dashSection = '';
  const from = STATE.dashFrom, to = STATE.dashTo, sec = STATE.dashSection;

  const inRange = (mk, dateField) => STATE.data[MODULES[mk].storageKey].filter(r=>{
    const d = r[dateField];
    if(!d) return false;
    if(from && d < from) return false;
    if(to && d > to) return false;
    if(sec && MODULES[mk].machineField){
      if(machineSection(r[MODULES[mk].machineField]) !== sec) return false;
    }
    return true;
  });
  const bySection = (list, machineField) => sec ? list.filter(r=> machineSection(r[machineField])===sec) : list;

  let html = `<div class="page-head"><div><h2>📊 Dashboard</h2>
      <div class="page-sub">Maintenance overview — Enam Trims Ltd</div></div></div>
      <div class="filter-bar">
        <div class="filter-field"><label>From</label><input type="date" value="${esc(from)}" onchange="STATE.dashFrom=this.value; renderMain();"></div>
        <div class="filter-field"><label>To</label><input type="date" value="${esc(to)}" onchange="STATE.dashTo=this.value; renderMain();"></div>
        <div class="filter-field"><label>Section</label><select onchange="STATE.dashSection=this.value; renderMain();">
          <option value="">All sections</option>
          ${sectionOptions().map(o=>`<option value="${esc(o.value)}" ${sec===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
        </select></div>
        <div class="filter-field">
          <label>&nbsp;</label>
          <button class="btn btn-ghost btn-sm" onclick="STATE.dashFrom=firstDayOfMonth();STATE.dashTo=lastDayOfMonth();STATE.dashSection='';renderMain();">This Month, All Sections</button>
        </div>
      </div>
    <div class="divider"></div>`;

  // 1. PM schedule vs completion
  if(canView('pm')){
    const pmM = inRange('pm','scheduledDate');
    const completed = pmM.filter(r=>r.status==='Completed').length;
    const pct = pmM.length ? Math.round(completed/pmM.length*100) : 0;

    // 2 & 3: breakdown + downtime
    const bdAll = canView('breakdown') ? inRange('breakdown','date') : [];
    const open = bdAll.filter(r=>r.status!=='Resolved').length;
    const totalDown = bdAll.reduce((s,r)=>s+(Number(r.downtimeHours)||0),0);

    html += '<div class="cards-grid">';
    html += statCard('PM Completion', pct+'%', completed+' of '+pmM.length+' tasks completed');
    if(canView('breakdown')){
      html += statCard('Open Breakdowns', open, bdAll.length+' reported in range', open>0);
      html += statCard('Downtime Hours', totalDown.toFixed(1)+' h', 'across '+bdAll.length+' incident(s)');
    }
    if(canView('spareuse') || canView('sparereq')){
      const useM = canView('spareuse') ? inRange('spareuse','date') : [];
      const spareCost = useM.reduce((s,r)=>s+(Number(r.cost)||0),0);
      const pendingReq = canView('sparereq') ? bySection(STATE.data.sparereq.filter(r=>r.status==='Pending'), 'machineId').length : 0;
      html += statCard('Spare Parts Cost', 'BDT '+spareCost.toLocaleString(), useM.length+' consumption entries');
      html += statCard('Pending Spare Requests', pendingReq, 'awaiting procurement', pendingReq>0);
    }
    if(canView('repair')){
      const repM = inRange('repair','date');
      const repCost = repM.filter(r=>r.status==='Approved').reduce((s,r)=>s+(Number(r.cost)||0),0);
      html += statCard('Repair & Servicing Cost', 'BDT '+repCost.toLocaleString(), repM.length+' job(s) in range');
    }
    if(canView('risk')){
      const riskOpen = bySection(STATE.data.risk.filter(r=>r.status==='Open' && (r.severity==='High'||r.severity==='Critical')), 'machineId').length;
      html += statCard('Critical / High Risks Open', riskOpen, 'affecting production', riskOpen>0);
    }
    html += '</div>';
  }

  // Downtime by machine bar chart
  if(canView('breakdown')){
    const bdAll = inRange('breakdown','date');
    const byMachine = {};
    bdAll.forEach(r=>{ byMachine[r.machineId] = (byMachine[r.machineId]||0) + (Number(r.downtimeHours)||0); });
    const entries = Object.entries(byMachine).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const max = entries.length ? entries[0][1] : 1;
    html += `<div class="panel"><h3>Downtime Hours by Machine <span class="cnt">(selected range${sec?' · '+esc(sec):''})</span></h3>`;
    if(entries.length===0) html += `<div class="muted">No downtime recorded in this range.</div>`;
    entries.forEach(([mid,hrs])=>{
      html += `<div class="bar-row"><div class="lbl">${esc(machineName(mid))}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,hrs/max*100)}%"></div></div>
        <div class="num">${hrs.toFixed(1)}h</div></div>`;
    });
    html += `</div>`;
  }

  // Open breakdowns list
  if(canView('breakdown')){
    const openList = bySection(STATE.data.breakdown.filter(r=>r.status!=='Resolved'), 'machineId').sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,6);
    html += panelList('Active Breakdowns', openList, r=>`<b>${esc(machineName(r.machineId))}</b> — ${esc(r.reason).slice(0,80)} ${badgeHtml(r.status)}`, r=>fmtDate(r.date));
  }

  // Critical risks
  if(canView('risk')){
    const riskList = bySection(STATE.data.risk.filter(r=>r.status==='Open'), 'machineId').sort((a,b)=>{
      const order={Critical:0,High:1,Medium:2,Low:3};
      return (order[a.severity]??9)-(order[b.severity]??9);
    }).slice(0,6);
    html += panelList('Critical / High Risk Watch', riskList, r=>`${badgeHtml(r.severity)} <b>${esc(machineName(r.machineId))}</b> — ${esc(r.description).slice(0,80)}`, r=>fmtDate(r.date));
  }

  // Pending spare requests
  if(canView('sparereq')){
    const reqList = bySection(STATE.data.sparereq.filter(r=>r.status==='Pending'), 'machineId').sort((a,b)=>(a.neededBy||'9999').localeCompare(b.neededBy||'9999')).slice(0,6);
    html += panelList('Pending Spare Part Requests', reqList, r=>`<b>${esc(r.partName)}</b> × ${esc(r.qtyNeeded)} ${r.machineId?('for '+esc(machineName(r.machineId))):''}`, r=>r.neededBy? ('needed by '+fmtDate(r.neededBy)) : '—');
  }

  if(!canView('pm') && !canView('breakdown')){
    html += `<div class="panel"><div class="muted">No dashboard data available for your role. Use the menu to report a breakdown.</div></div>`;
  }

  return html;
}
function statCard(label, value, note, warn){
  return `<div class="stat-card ${warn?'accent':''}"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="note">${esc(note)}</div></div>`;
}
function panelList(title, items, lineFn, rightFn){
  let html = `<div class="panel"><h3>${esc(title)} <span class="cnt">(${items.length})</span></h3>`;
  if(items.length===0){ html += `<div class="muted">Nothing to show right now.</div>`; }
  else {
    items.forEach(r=>{
      html += `<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;">
        <div>${lineFn(r)}</div><div class="muted" style="white-space:nowrap;">${rightFn(r)}</div></div>`;
    });
  }
  html += `</div>`;
  return html;
}

// ===================== SEARCH / REPORTS =====================
function renderSearchTab(){
  const sf = STATE.searchFilters;
  const searchable = Object.keys(MODULES).filter(mk=>mk!=='users' && canView(mk));
  // "All modules" only sweeps actual day-to-day records (things with a real date).
  // Master data (Machines, Sections, Spare Parts Catalog, Team Directory) doesn't
  // have a meaningful date, so it would otherwise flood the top of every search
  // with today's date. It's still searchable — just pick it from the Module list.
  const searchableDefault = searchable.filter(mk=>!!MODULES[mk].dateField);

  let html = `<div class="page-head"><div><h2>🔍 Search & Reports</h2>
    <div class="page-sub">Find any record across every maintenance module — by date, section, machine, or user.</div></div></div>
    <div class="divider"></div>`;

  html += `<div class="filter-bar">
    <div class="filter-field"><label>Module</label><select onchange="sf('module',this.value)">
      <option value="all" ${sf.module==='all'?'selected':''}>All modules</option>
      ${searchable.map(mk=>`<option value="${mk}" ${sf.module===mk?'selected':''}>${MODULES[mk].label}</option>`).join('')}
    </select></div>
    <div class="filter-field"><label>From</label><input type="date" value="${esc(sf.from)}" onchange="sf('from',this.value)"></div>
    <div class="filter-field"><label>To</label><input type="date" value="${esc(sf.to)}" onchange="sf('to',this.value)"></div>
    <div class="filter-field"><label>Section</label><select onchange="sf('section',this.value)">
      <option value="">All sections</option>
      ${sectionOptions().map(o=>`<option value="${esc(o.value)}" ${sf.section===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select></div>
    <div class="filter-field"><label>Machine</label><select onchange="sf('machine',this.value)">
      <option value="">All machines</option>
      ${machineOptions().map(o=>`<option value="${esc(o.value)}" ${sf.machine===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select></div>
    <div class="filter-field grow"><label>Keyword</label><input type="text" placeholder="Search reason, description, part name…" value="${esc(sf.q)}" oninput="sf('q',this.value)"></div>
    <button class="btn btn-ghost btn-sm" onclick="clearSearch()">Clear</button>
  </div>`;

  const modulesToSearch = sf.module==='all' ? searchableDefault : [sf.module];
  let results = [];
  modulesToSearch.forEach(mk=>{
    const mod = MODULES[mk];
    let recs = STATE.data[mod.storageKey];
    recs = recs.filter(r=>{
      if(sf.machine && mod.machineField && r[mod.machineField]!==sf.machine) return false;
      if(sf.section && mod.machineField && machineSection(r[mod.machineField])!==sf.section) return false;
      if(mod.dateField){
        const d = r[mod.dateField];
        if(sf.from && (!d || d<sf.from)) return false;
        if(sf.to && (!d || d>sf.to)) return false;
      }
      if(sf.q){
        const q=sf.q.toLowerCase();
        const hay = mod.fields.filter(f=>f.type==='text'||f.type==='textarea').map(f=>String(r[f.name]||'')).join(' ').toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
    recs.forEach(r=> results.push({mk, mod, r}));
  });
  results.sort((a,b)=>{
    const da = a.r[a.mod.dateField]||a.r.createdAt||'';
    const db = b.r[b.mod.dateField]||b.r.createdAt||'';
    return String(db).localeCompare(String(da));
  });

  html += `<div class="table-wrap"><table><thead><tr><th>Module</th><th>Date</th><th>Section</th><th>Machine</th><th>Summary</th><th>Status</th><th>By</th></tr></thead><tbody>`;
  if(results.length===0){
    html += `<tr class="empty-row"><td colspan="7">No records match these filters.</td></tr>`;
  } else {
    results.slice(0,300).forEach(({mk,mod,r})=>{
      const dateVal = mod.dateField ? r[mod.dateField] : (r.createdAt||'').slice(0,10);
      const summaryField = mod.fields.find(f=>f.filterText) || mod.fields.find(f=>f.type==='textarea') || mod.fields[0];
      const statusField = mod.fields.find(f=>f.name==='status');
      html += `<tr>
        <td>${mod.icon} ${esc(mod.label)}</td>
        <td>${fmtDate(dateVal)}</td>
        <td class="muted">${mod.machineField ? esc(machineSection(r[mod.machineField])||'—') : '—'}</td>
        <td>${mod.machineField ? esc(machineName(r[mod.machineField])) : '—'}</td>
        <td class="cell-wrap">${esc(String(r[summaryField.name]||'—')).slice(0,90)}</td>
        <td>${statusField && r.status ? badgeHtml(r.status) : '—'}</td>
        <td class="muted">${esc(r.createdByName||'—')}</td>
      </tr>`;
    });
  }
  html += `</tbody></table></div>`;
  if(results.length>300) html += `<div class="muted" style="margin-top:8px;">Showing first 300 of ${results.length} results — narrow your filters to see more precisely.</div>`;
  return html;
}
function sf(key,val){ STATE.searchFilters[key]=val; renderMain(); }
function clearSearch(){ STATE.searchFilters={module:'all',from:'',to:'',machine:'',section:'',q:''}; renderMain(); }

function renderUsersTab(){
  if(permLevel('users')==='none'){
    return `<div class="panel">You do not have access to this section.</div>`;
  }
  let html = renderModuleTab('users');

  // Team Directory cross-reference — anyone in the (now editable) Team
  // Directory who doesn't have a login yet, with a one-click "Create Login".
  const existingNames = new Set(STATE.data.users.map(u=>u.name.toLowerCase()));
  const notYetAdded = STATE.data.roster.filter(p=>!existingNames.has(p.name.toLowerCase()));
  if(notYetAdded.length>0 && canCreate('users')){
    html += `<div class="panel"><h3>Maintenance Team Directory <span class="cnt">(people without a login yet — manage the full list under Master Data → Maintenance Team Directory)</span></h3>`;
    notYetAdded.forEach((p)=>{
      html += `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);">
        <div><b>${esc(p.name)}</b> — ${esc(p.title)} <span class="muted">(${esc(p.phone||'—')})</span>
          <div class="muted" style="margin-top:3px;max-width:640px;">${esc(p.responsibility||'')}</div></div>
        <button class="btn btn-sm btn-ghost" style="white-space:nowrap;" onclick="prefillUserFromRoster('${p.id}')">+ Create Login</button>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="panel"><h3>Roles & Access Overview <span class="cnt">(role defaults — use the "Access" button on a user to override)</span></h3>
    <div class="table-wrap" style="box-shadow:none;">
    <table class="perm-table"><thead><tr><th>Role</th>${PERM_MODULE_KEYS.map(k=>`<th>${MODULES[k].icon}<br>${esc(MODULES[k].label.split(' ')[0])}</th>`).join('')}</tr></thead><tbody>`;
  Object.keys(PERMS).forEach(role=>{
    const p = PERMS[role];
    html += `<tr><td><b>${role}</b><div class="muted">${esc(ROLE_DESC[role])}</div></td>`;
    PERM_MODULE_KEYS.forEach(k=>{
      html += `<td>${levelBadge(p[k]||'none')}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}
function levelBadge(lvl){
  const map = {none:'b-gray', view:'b-forest', create:'b-amber', edit:'b-amber', full:'b-green'};
  const label = {none:'No access', view:'View', create:'Add', edit:'Edit', full:'Full'}[lvl];
  return `<span class="badge ${map[lvl]}">${label}</span>`;
}

// ===================== HELP & EXAMPLES =====================
function renderHelpTab(){
  let html = `<div class="page-head"><div><h2>❓ Help & Examples</h2>
    <div class="page-sub">A quick walkthrough of the whole system, using your own machines and team as examples.</div></div></div>
    <div class="divider"></div>`;

// ===================== LOGIN / SESSION =====================
async function tryAutoLogin(){
  const sess = await getPersonal('session_user');
  if(sess && sess.userId){
    const u = STATE.data.users.find(x=>x.id===sess.userId && x.active!=='No');
    if(u){ STATE.user = {id:u.id, name:u.name, role:u.role, section:u.section}; return true; }
  }
  return false;
}

function renderLogin(error){
  const hasUsers = STATE.data.users.length>0;
  let html = `<div class="login-wrap"><div class="login-card">
    <div class="login-logo"><img src="data:image/png;base64,${LOGO_FULL_B64}" alt="Enam Trims Ltd logo" style="height:auto;width:100%;max-width:280px;border-radius:10px;margin-bottom:8px;"></div>`;

  if(!hasUsers){
    html += `<h2>Set up the first Admin account</h2>
      <div class="lead">No users exist yet. Create the administrator account to get started — you can add the rest of the team, and control exactly what each person can see and edit, afterwards.</div>
      <form onsubmit="setupFirstAdmin(event)">
        <div class="field"><label>Full Name <span class="req">*</span></label><input name="name" required></div>
        <div class="field" style="margin-top:10px;"><label>Section</label><input name="section" placeholder="e.g. Maintenance"></div>
        <div class="field" style="margin-top:10px;"><label>Choose a Username <span class="req">*</span></label><input name="username" required placeholder="e.g. admin"></div>
        <div class="field" style="margin-top:10px;"><label>Choose a Password <span class="req">*</span></label><input type="password" name="password" required></div>
        <button class="btn btn-primary" style="width:100%;margin-top:14px;" type="submit">Create Admin Account</button>
      </form>`;
  } else {
    html += `<h2>Sign in</h2>
      <div class="lead">Enter the username and password your Admin gave you.</div>
      <form onsubmit="submitLogin(event)">
        <div class="field"><label>Username</label><input name="username" required autofocus autocapitalize="off"></div>
        <div class="field" style="margin-top:10px;"><label>Password</label><input type="password" name="password" required></div>
        ${error?`<div class="login-error">${esc(error)}</div>`:''}
        <button class="btn btn-primary" style="width:100%;margin-top:14px;" type="submit">Sign In</button>
      </form>
      <div class="field-hint" style="margin-top:12px;">Don't have a login yet, or forgot your password? Ask your Admin to create or reset it in Users &amp; Access.</div>`;
  }
  html += `</div></div>`;
  document.getElementById('app').innerHTML = html;
}

async function setupFirstAdmin(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const username = (fd.get('username')||'').trim().toLowerCase();
  const password = fd.get('password');
  if(!username || !password){ toast('Username and password are required.'); return; }
  const u = {id:uid('user'), name:fd.get('name'), role:'Admin', section:fd.get('section')||'', username, password, phone:'', active:'Yes',
    createdBy:'system', createdByName:'system', createdAt:new Date().toISOString()};
  STATE.data.users.push(u);
  await saveArr(DKEYS.users, STATE.data.users);
  STATE.user = {id:u.id, name:u.name, role:u.role, section:u.section};
  await setPersonal('session_user', {userId:u.id});
  boot2();
}
async function submitLogin(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const username = (fd.get('username')||'').trim().toLowerCase();
  const password = fd.get('password');
  const u = STATE.data.users.find(x=>(x.username||'').toLowerCase()===username && x.active!=='No');
  if(u && u.password===password){
    STATE.user = {id:u.id, name:u.name, role:u.role, section:u.section};
    await setPersonal('session_user', {userId:u.id});
    boot2();
  } else {
    renderLogin('Incorrect username or password. Please try again.');
  }
}
async function signOut(){
  STATE.user=null;
  await setPersonal('session_user', {userId:null});
  renderLogin();
}

// ===================== SHELL / ROUTER =====================
const TAB_GROUPS = [
  { label:'Overview', tabs:[
    {key:'dashboard', label:'Dashboard', icon:'📊', always:true},
    {key:'search', label:'Search & Reports', icon:'🔍', always:true},
    {key:'help', label:'Help & Examples', icon:'❓', always:true}
  ]},
  { label:'Master Data', hint:'Admin managed', tabs:[
    {key:'machines', label:'Machines & Utilities', icon:'⚙️'},
    {key:'sections', label:'Sections & Departments', icon:'🏷️'},
    {key:'stock', label:'Spare Parts Catalog', icon:'📦'},
    {key:'roster', label:'Maintenance Team Directory', icon:'📇'}
  ]},
  { label:'Daily Records', tabs:[
    {key:'pm', label:'Preventive Maintenance', icon:'🗓️'},
    {key:'breakdown', label:'Breakdown & Downtime', icon:'🛠️'},
    {key:'spareuse', label:'Spare Parts — Usage', icon:'🧾'},
    {key:'sparereq', label:'Spare Parts — Requests', icon:'📝'},
    {key:'repair', label:'Repair & Servicing Cost', icon:'💰'},
    {key:'risk', label:'Critical Risk Register', icon:'⚠️'}
  ]},
  { label:'Administration', tabs:[
    {key:'users', label:'Users & Access', icon:'👤', permKey:'users'}
  ]}
];
// Flat list kept for lookups elsewhere (e.g. renderMain routing)
const TAB_DEFS = TAB_GROUPS.flatMap(g=>g.tabs);

function renderShellFrame(){
  const u = STATE.user;
  let html = `<div class="topbar">
    <div class="brand"><img src="data:image/png;base64,${LOGO_ICON_B64}" alt="logo">
      <div class="brand-text"><div class="co">ENAM TRIMS LTD</div><div class="sub">Maintenance ERP</div></div></div>
    <div class="who"><span class="name">${esc(u.name)}</span><span class="role-pill">${esc(u.role)}</span>
      <button class="signout" onclick="signOut()">Sign out</button></div>
  </div>
  <div class="shell">
    <div class="sidebar" id="sidebarNav"></div>
    <div class="main" id="mainArea"></div>
  </div>`;
  document.getElementById('app').innerHTML = html;
  renderSidebar();
  renderMain();
}
function renderSidebar(){
  const nav = document.getElementById('sidebarNav');
  let html = '';
  TAB_GROUPS.forEach(g=>{
    const visibleTabs = g.tabs.filter(t=>{
      const pk = t.permKey || t.key;
      return t.always || canView(pk);
    });
    if(visibleTabs.length===0) return;
    html += `<div class="side-label">${esc(g.label)}${g.hint?` <span style="opacity:.6;">(${esc(g.hint)})</span>`:''}</div>`;
    visibleTabs.forEach(t=>{
      html += `<button class="side-btn ${STATE.tab===t.key?'active':''}" onclick="setTab('${t.key}')">
        <span class="side-icon">${t.icon}</span><span>${t.label}</span></button>`;
    });
  });
  nav.innerHTML = html;
}
function setTab(tab){ STATE.tab = tab; renderMain(); }

function renderMain(){
  renderSidebar();
  const el = document.getElementById('mainArea');
  if(!el) return;
  let html='';
  if(STATE.tab==='dashboard') html = renderDashboard();
  else if(STATE.tab==='search') html = renderSearchTab();
  else if(STATE.tab==='users') html = renderUsersTab();
  else if(STATE.tab==='help') html = renderHelpTab();
  else if(MODULES[STATE.tab]) html = renderModuleTab(STATE.tab);
  else html = renderDashboard();
  el.innerHTML = html;
}

// ===================== BOOT =====================
async function boot(){
  if(!SUPABASE_CONFIGURED){
    document.getElementById('app').innerHTML = `<div class="login-wrap"><div class="login-card">
      <div class="login-logo"><img src="data:image/png;base64,${LOGO_FULL_B64}" alt="Enam Trims Ltd logo" style="height:auto;width:100%;max-width:280px;border-radius:10px;margin-bottom:8px;"></div>
      <h2>Almost there</h2>
      <div class="lead">This app isn't connected to a database yet. Open <code>index.html</code>, find <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of the script, and paste in your Supabase project's values (Settings → API). See the README for the full walkthrough.</div>
    </div></div>`;
    return;
  }
  await loadAllData();
  // Sections are foundational config — auto-populate on first run so every
  // machine form has options ready, even before an Admin visits that page.
  if(STATE.data.sections.length===0){
    STATE.data.sections = SEED_SECTIONS.map(name=>({
      id: uid('sections'), name, notes:'',
      createdBy:'system', createdByName:'system', createdAt:new Date().toISOString()
    }));
    await saveArr(DKEYS.sections, STATE.data.sections);
  }
  const auto = await tryAutoLogin();
  if(auto){ boot2(); } else { renderLogin(); }
}
function boot2(){
  STATE.tab='dashboard';
  renderShellFrame();
}
boot();

</script>
